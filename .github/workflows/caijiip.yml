name: Update IP Lists

on:
  schedule:
    - cron: '0 0 */1 * *'  # 每1天的0点（UTC时间）运行一次
  workflow_dispatch:  # 手动触发
  # push: # 允许提交触发

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 获取完整的历史记录
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install beautifulsoup4
        
    - name: List files before script
      run: |
        echo "当前目录文件列表:"
        ls -la
        echo "---"
        
    - name: Run script
      run: |
        python collect_ips.py
        echo "脚本执行完成，检查生成的文件:"
        for file in ip.txt ipv4.txt ipv6.txt domain.txt; do
          if [ -f "$file" ]; then
            echo "$file 存在，内容前5行:"
            head -5 "$file"
            echo "文件行数:"
            wc -l "$file"
            echo "---"
          else
            echo "$file 不存在!"
          fi
        done
        
    - name: Show git status
      run: |
        echo "Git状态:"
        git status
        echo "---"
        echo "变更的文件:"
        git diff --name-only
        
    - name: Commit and push changes
      run: |
        git config --global user.email "o.osilhouette@gmail.com"
        git config --global user.name "KAUIN"
        git config --global pull.rebase false
        
        # 拉取最新更改，避免冲突
        git pull origin main
        
        # 检查所有相关文件是否有变化
        files_changed=false
        files_to_check=("ip.txt" "ipv4.txt" "ipv6.txt" "domain.txt")
        
        for file in "${files_to_check[@]}"; do
          if [ -n "$(git status --porcelain "$file")" ]; then
            echo "检测到 $file 有变化"
            git add "$file"
            files_changed=true
          fi
        done
        
        if [ "$files_changed" = true ]; then
          echo "有文件发生变化，准备提交"
          git commit -m "Automatic update: $(date '+%Y-%m-%d %H:%M:%S')
          - 更新IP列表和域名"
          git push origin main
          echo "已提交并推送更改"
        else
          echo "没有文件发生变化，跳过提交"
        fi
